; ZRadio – internetni radio za ESP32-S3 N16R8
; Build:  pio run          Upload: pio run -t upload       Monitor: pio device monitor

[env:esp32s3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino

board_build.arduino.memory_type = dio_opi
board_build.flash_mode = dio
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = partitions_16MB.csv
board_build.filesystem = littlefs

monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600

build_flags =
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=1
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DCONFIG_ASYNC_TCP_STACK_SIZE=8192
    -DZR_VERSION=\"0.7.2\"

extra_scripts = pre:tools/embed_web.py

lib_deps =
    ; ESP32-audioI2S 3.4.4 je v lib/ (popravljen sklad dekodirnega opravila)
    https://github.com/ESP32Async/AsyncTCP.git#v3.5.0
    https://github.com/ESP32Async/ESPAsyncWebServer.git#v3.12.1
    https://github.com/bblanchon/ArduinoJson.git#v7.4.3
    https://github.com/olikraus/U8g2_Arduino.git#2.37.1
    https://github.com/lovyan03/LovyanGFX.git#1.2.32
